title: Session 6 · Three audiences, one rate
file: src/invalid_agent/nodes/status.py
overview: Customer, internal, and leadership notes share one rate line. The customer note does not state
  a cause as fact. The color is red, amber, or green, which the code calls RAG. It is not a retrieval
  index. The walkthrough file is not rewritten, so that case does not turn green.
voice: en-US-AndrewNeural
rate: +0%
pause: 0.35
segments:
- lines: 20-26
  say: Green requires the rate to be back inside the spec. Red is an open breach before the containment
    week. Amber means containment is on the plan and the effect has not been observed. The color is a
    rule about the rate and the week, not a sentence the model picks.
- lines: 32-41
  say: The customer actions are words. They do not name the cause type and they do not say the root cause
    is confirmed. A later week can talk about the lot under review without turning the note into a finding.
- lines: 100-144
  say: The facts dictionary is the only number source for the three notes. Cost is the invalid count times
    the unit cost from the scenario, computed here, not typed into the template. Rounded percents are
    what the guard will accept.
- lines: 146-169
  say: status_node narrates each audience, then runs the guard again. A new number fails the note. The
    decision log keeps one row per week, replaced if that week is written twice. The three strings are
    what get written to disk.
