title: Session 1 · Settings and the secret boundary
file: src/invalid_agent/config.py
overview: config.py is the only place that reads the Jira token and the openFDA key. Printing the settings
  object shows a redacted view, so a log cannot become a leak. The invalid-rate cap is calculated from
  the 98 percent validity promise, and a missing or unknown model backend falls back to deterministic.
  That is the path CI runs.
voice: en-US-AndrewNeural
rate: +0%
pause: 0.35
segments:
- lines: 14-23
  say: The two spec constants are one promise. Ninety-eight percent valid means the invalid rate stays
    at or under two percent, and the cap is computed so the two cannot be edited apart. The default local
    model tag is Llama 3.1 8B. The smaller tag is only a suggestion for a laptop. Hosted Streamlit does
    not use either one.
- lines: 43-94
  say: Settings is frozen after it loads. Jira turns on only when the site, the email, and the token are
    all present. Two out of three stays off. The redacted view masks the token and the openFDA key, and
    the printed form of the object uses that view. The raw token is not interpolated into the string.
- lines: 96-119
  say: load_settings reads the environment. Friendly names such as rules-only become deterministic, and
    an unknown name does too, so a typo on a demo falls back to the template instead of crashing. The
    longer Jira variable names win when both aliases are set. Nothing in this function opens a socket.
