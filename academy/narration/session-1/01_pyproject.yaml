title: "Session 1 · Clip 1 · pyproject.toml"
file: ../../snapshots/session-1/pyproject.toml
voice: en-US-AndrewNeural
rate: "+0%"
pause: 0.5
segments:
  - lines: 1-30
    say: "Welcome to Session 1 of the invalid agent project. Before we touch any Python logic, we start with the file that tells Python what this project even is. It's called pyproject dot toml. Think of it like the cover sheet on a project charter. It names the project, says who owns it, lists what it depends on, and tells the tools where to find things. Every modern Python project has one, and it's the first file a reviewer opens to understand how the project is put together. TOML is just a simple settings format, with section headers in square brackets and key equals value lines underneath."
  - lines: 1-3
    say: "The first block is called build system. It answers one question: what tool turns this folder into an installable package? We use setuptools, version 68 or newer, plus wheel. Setuptools is the standard, boring, widely supported choice, and boring is good here. With this block in place, you can run pip install dash e dot, and Python will treat the project's code as a real package you can import from anywhere. The dash e means editable: when you change a file, you don't have to reinstall. The change shows up right away."
  - lines: 5-8
    say: "Next is the project section, which holds the metadata. Line 6 is the package name, invalid dash agent. Line 7 is the version, zero point one point zero. In semantic versioning, a leading zero means early and still changing, which is honest for Session 1. Line 8 is a one-sentence description: a simulated field quality investigation agent for an invalid rate escalation on a molecular diagnostic panel. That sentence is the product in a nutshell. The word simulated matters. Everything in this project is fictional, and we say so from day one."
  - lines: 9-13
    say: "Line 9 points to the README so package indexes can show it. Line 10 is important: requires python greater than or equal to 3.11. That's a promise. If someone tries an older Python, pip stops them with a clear message, instead of a confusing crash later. Line 11 is the MIT license, which lets people read and reuse the code freely. That fits a public portfolio project. Line 12 lists you as the author, and line 13 adds search keywords: P M, quality, simulation, CAPA, and S P C. CAPA means corrective and preventive action, and S P C means statistical process control. Those keywords tell a hiring manager what domain this lives in."
  - lines: 14
    say: "Line 14 is my favorite line in the file. Dependencies equals an empty list. The running code needs nothing outside Python's standard library. That's a deliberate choice. Later sessions add pandas, scipy, LangGraph, plotly, python pptx, and Streamlit, but only when code actually imports them. Adding them now would make every C I run download big libraries that no test uses. Same with the language model: there's no Ollama client yet. When we get there, the local default is Meta's llama 3.1, 8 billion parameters, running through Ollama on your laptop, and the hosted Streamlit demo uses the smaller Llama 3.2, 1 billion. But that's a later session."
  - lines: 16-17
    say: "Lines 16 and 17 define optional dependencies, in a group called dev. The only one is pytest, version 8 or newer. Optional means a regular user who just runs the tool doesn't get it, but a developer can run pip install dash e, dot, bracket dev, and get the testing tools too. You'll see exactly that command later, in the C I workflow. Pytest is the most common Python test runner. You write plain functions that start with the word test, use plain assert statements, and pytest finds them and runs them."
  - lines: 19-20
    say: "Lines 19 and 20 register a command line script. After installing, typing invalid dash agent in a terminal would call the main function in the invalid agent dot graph module. Here's a detail worth noticing: the graph module doesn't exist yet in Session 1. That's fine, because nothing runs this command yet. It's a placeholder for the agent graph we build later. Think of it like reserving a room on the floor plan before the furniture arrives."
  - lines: 22-23
    say: "Lines 22 and 23 tell setuptools to look for packages inside the source folder, s r c. This is called the src layout. Putting code under s r c, instead of at the top of the repo, stops a classic mistake: tests accidentally importing your local folder instead of the installed package. With this layout, the tests import what a real user would get."
  - lines: 25-27
    say: "Lines 25 through 27 configure pytest itself. Test paths equals tests means pytest only looks in the tests folder. A d d opts dash q means quiet output: a row of dots and a summary, not a wall of text. Because these settings live here, you just type pytest with no extra flags, on your laptop and in C I, and get the same behavior."
  - lines: 29-30
    say: "Finally, lines 29 and 30 ship a tiny empty file called py dot typed with the package. It's a signal to type checkers that this package has type hints, so editors can autocomplete and flag mistakes. That's the whole file. The takeaway: pyproject is the contract for how this project installs and tests, and it stays lean on purpose. Next, we'll open the only runtime module in Session 1, config dot p y."
