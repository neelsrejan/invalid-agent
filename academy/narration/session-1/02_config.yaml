title: "Session 1 · Clip 2 · src/invalid_agent/config.py"
file: ../../snapshots/session-1/src/invalid_agent/config.py
voice: en-US-AndrewNeural
rate: "+0%"
pause: 0.5
segments:
  - lines: 1-5
    say: "This is config dot p y, the only runtime module in Session 1. Its job is to collect every setting the agent needs in one place: which language model backend to use, the Jira connection details, the openFDA key, and the product spec. The docstring at the top states the two rules: secrets come only from environment variables, and printing the settings never shows a Jira token or an openFDA key. Environment variables are named values your operating system hands to a program. They're the standard place to keep secrets, so secrets never get written into code or committed to GitHub."
  - lines: 7-11
    say: "Line 7, from future import annotations, lets us write modern type hints without worrying about the order things are defined. Then three standard library imports. O S reads environment variables. Dataclass, from the dataclasses module, builds a class that just holds data, without writing boilerplate. And Path, from path lib, handles file paths cleanly on Windows, Mac, and Linux. No third-party packages at all, which matches the empty dependency list we saw in pyproject."
  - lines: 13-15
    say: "Lines 13 through 15 lock in the product spec. The comment says it plainly: promised validity of at least 98 percent means an invalid rate spec of at most 2 percent. Line 14 stores 0.98. Line 15 doesn't type 0.02 by hand. It calculates it: one minus promised validity, rounded to two decimals. Why calculate it? So the two numbers can never drift apart. If someone changes one, the other follows. And why round? Because computers store decimals in binary, one minus 0.98 actually comes out as 0.020000000000000018. Rounding gives a clean 0.02 that tests can compare exactly. Every later metric in this project gets compared against this constant."
  - lines: 17
    say: "Line 17 is an allow list of language model backends: deterministic, ollama, and llama c p p. Deterministic means rules only, with no model at all, so the same input always gives the same output. Ollama is the local model server you just installed, where the default model is Meta's llama 3.1 8 B. Llama c p p is another way to run a model file directly. The leading underscore in the name is a Python convention meaning private to this module. Anything not on this list gets rejected later."
  - lines: 20-29
    say: "Lines 20 through 29 are find repo root. It answers: where is the top of the project folder? That matters because later sessions load scenario files relative to it. Line 22 finds where this file lives. Line 23 builds a list of candidate folders: first the current working directory, then every parent folder of this file. Line 24 loops through them. Line 25 accepts a folder that has pyproject dot toml next to a scenarios folder, which is what the full project looks like. Line 27 accepts pyproject next to s r c slash invalid agent, which is what Session 1 looks like, since scenarios don't exist yet. Line 29 is the last resort: two levels up from this file's folder. It's boring on purpose, and that's the point. It works whether Streamlit starts from the repo or the package is imported from an editable install."
  - lines: 32-33
    say: "Lines 32 and 33 are a tiny helper called underscore env. It reads an environment variable, uses a default if it's missing, and strips spaces from both ends. That strip matters. If someone accidentally sets a token to just a couple of spaces, it becomes an empty string, and an empty string counts as not configured. So a blank token can never accidentally switch on the Jira integration."
  - lines: 36-50
    say: "Lines 36 through 50 define the Settings class. The at dataclass line above it, with frozen equals true, does two things. Dataclass writes the constructor for us from the list of fields. Frozen means once a Settings object is created, nobody can change it. Settings are read once at startup and then stay fixed, so no part of the program can quietly change the model or the Jira site halfway through a run. The fields are typed: strings for the backend, Ollama host, model name, Jira details and openFDA key; floats for the two spec numbers; and Path for the repo root and output folder. Secrets are plain strings, and they're empty when not set."
  - lines: 52-55
    say: "Lines 52 through 55 are jira enabled, the single switch the Jira client in Session 5 will check. The at property decorator means you read it like a field, settings dot jira enabled, with no parentheses. It returns true only if all three are present: base U R L, email, and A P I token. Here's a worked example. Say the U R L is set, the email is set, but the token is empty. In Python, A and B and C returns the first empty value it hits, so the result is the empty string, and bool of an empty string is false. Two out of three stays offline. That's what an optional integration means."
  - lines: 57-59
    say: "Lines 57 through 59, rules only, is another convenience switch. It's true when the backend is deterministic. Later code can just ask, are we rules only, instead of comparing strings everywhere."
  - lines: 61-78
    say: "Lines 61 through 78 are redacted. It returns a dictionary that's safe to print or log. Most fields pass through as is. Look at lines 70 and 73: the Jira token and the openFDA key become three asterisks if they're set, or an empty string if they're not. Notice they're masked, not removed. That's on purpose. When you're debugging, you still want to see whether a token is configured, without seeing the token itself. Paths are converted to plain strings so the dictionary is easy to log as JSON."
  - lines: 80-87
    say: "Lines 80 through 87 override underscore underscore repr. Repr is what Python shows when you print an object or it shows up in an error message. Here's the catch: a dataclass writes its own repr automatically, and that default prints every field, including the raw Jira token. One stray print statement or one crash log, and the secret leaks. So we replace it. Line 81 calls redacted first, then the string only includes three harmless fields: the backend, whether Jira is enabled, and the spec invalid rate. It never touches self dot jira A P I token directly."
  - lines: 90-96
    say: "Now the function that builds everything, load settings. The docstring explains one more design choice: aliases. The build plan used the names Jira U R L and Jira token. The runbook uses Jira base U R L and Jira A P I token. Both work, and if both are set, the longer, official names win."
  - lines: 97-101
    say: "Line 97 reads L L M backend, defaults to deterministic, and lowercases it. Lines 98 and 99 accept friendly synonyms, like rules, rules only, or mock, and map them to deterministic. Lines 100 and 101 are the safety net: anything not on the allow list also becomes deterministic. Why not raise an error? Because a hosted demo with a typo in its settings should fall back to rules and keep working, not crash in front of a hiring manager."
  - lines: 103-104
    say: "Line 103 finds the repo root with the function we just walked through. Line 104 picks the output folder. By default it's a folder called out inside the repo, but you can override it with the variable invalid agent out."
  - lines: 105-119
    say: "Lines 105 through 119 fill in the Settings object. Line 107 is the Ollama host, defaulting to your own machine on port one one four three four, which is where Ollama listens. The r strip removes a trailing slash. Line 108 is the model name, defaulting to llama 3.1 colon 8 b, Meta's 8 billion parameter model that you pull with Ollama. Lines 110 and 112 are the alias precedence: the or operator means use the official name if it's non-empty, otherwise the alias. Line 110 also strips a trailing slash, so the same site can't look like two different sites later. Line 113 defaults the Jira project key to I N V. And lines 115 and 116 copy in the spec constants. That's config dot p y: one frozen object, secrets masked, offline by default. Next, we'll look at the tests that prove all of this."
