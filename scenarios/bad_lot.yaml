  - {id: L-4425, start_day: 125, end_day: 180}
root_cause:
  type: bad_reagent_lot
  lot_id: L-4419
  start_day: 120
  stratum_invalid_rate: 0.18
  dominant_code: INV-IC
complaint: >
  Synthetic complaint, not a real customer. Northlake Health reports that
  MDx-24 invalids this month are well above the ≥98% validity they were
  sold. They have paused reporting on the panel and asked for a written
  position today. Wording is original and only themed on public IVD
  failure modes (internal-control failure, extraction failure).
injections:
  - week: 0
    source: customer
    audience: customer
    text: >
      Northlake Health escalated to their lab director. They want the
      current invalid rate, whether it breaks the ≥98% validity commitment,
      and what we are doing this week.
  - week: 1
    source: QA
    audience: internal
    text: >
      QA notes reagent lot L-4419 entered distribution on day 120, the same
      window as the invalid spike. Earlier lots L-4401 and L-4412 are no
      longer shipping.
  - week: 2
    source: R&D
    audience: internal
    text: >
      R&D reports lot L-4419 passed release testing. Internal control and
      external QC on the release panel were inside their limits. The
      release sample was not a field specimen.
  - week: 2
    source: customer
    audience: customer
    text: >
      The lab director wants a written customer update today and has asked
      whether they should stop using every lot or only the current one.
  - week: 3
    source: manufacturing
    audience: internal
    text: >
      Manufacturing logged a two-hour shipping-temperature excursion on lot
      L-4425, not on L-4419. L-4425's field rate has not moved.
  - week: 3
    source: management
    audience: leadership
    text: >
      Leadership asks for the cost of the invalids so far and the cost of
      quarantine versus a broader field action.
  - week: 4
    source: management
    audience: leadership
    text: >
      Leadership wants a recommendation: contain the lot, expand the
      investigation, or do both, and the effectiveness check that would
      close it.
