[theme]
base = "light"
primaryColor = "#0B3A5B"
backgroundColor = "#F7F5F2"
secondaryBackgroundColor = "#E7EEF2"
textColor = "#1C2830"
font = "sans serif"

[server]
headless = true
# Streamlit drops a changed imported module only when the file watcher is on.
# "none" left charts, deck, hypotheses, planner, and triage on the previous
# deploy in memory. poll checks mtimes without the inotify watcher.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
